<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h2 { font-size: 20px; margin-bottom: 6px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 16px; }

    /* Palette grid */
    .palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .palette-card {
      background: #2a2a40;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .palette-card:hover { background: #3a3a55; }
    .palette-card.active { border-color: #6c63ff; background: #33305a; }
    .palette-card .icon { font-size: 20px; }
    .palette-card .name { font-size: 13px; font-weight: 600; margin-top: 4px; }
    .palette-card .desc { font-size: 11px; color: #888; margin-top: 2px; }
    .palette-card .preview {
      display: flex;
      gap: 3px;
      margin-top: 6px;
    }
    .palette-card .preview .swatch {
      width: 16px; height: 16px;
      border-radius: 3px;
    }

    /* Controls */
    .controls {
      background: #2a2a40;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .controls label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #aaa;
    }
    .controls input[type="range"] {
      width: 100%;
      accent-color: #6c63ff;
    }
    .intensity-value {
      text-align: right;
      font-size: 12px;
      color: #6c63ff;
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #6c63ff;
      color: white;
    }
    .btn-primary:hover { background: #5a52e0; }
    .btn-danger {
      background: #ff4757;
      color: white;
    }
    .btn-danger:hover { background: #e03e4d; }
    .btn-secondary {
      background: #3a3a55;
      color: #ccc;
    }
    .btn-secondary:hover { background: #4a4a65; }

    .status {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>🎨 ScreenTint</h2>
  <p class="subtitle">Select a palette, then start the overlay</p>

  <div id="palette-grid" class="palette-grid">
    <!-- Filled by JS -->
  </div>

  <div class="controls">
    <label>Intensity: <span id="intensity-value" class="intensity-value">100%</span></label>
    <input type="range" id="intensity" min="0" max="100" value="100" />
  </div>

  <button class="btn btn-primary" id="btn-start">▶ Start Full-Screen Overlay</button>
  <button class="btn btn-danger" id="btn-stop" style="display:none">■ Stop Overlay</button>
  <button class="btn btn-secondary" id="btn-reset">↺ Reset to Normal</button>

  <p class="status" id="status">Pick a palette to begin</p>

  <script>
    const { ipcRenderer } = require('electron');

    let activePaletteId = null;
    let overlayRunning = false;

    // ============================================================
    // Load palettes from vision-api (via main process)
    // ============================================================
    async function loadPalettes() {
      const palettes = await ipcRenderer.invoke('get-palettes');
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';

      palettes.forEach(p => {
        if (p.id === 'custom') return; // skip custom for now

        const card = document.createElement('div');
        card.className = 'palette-card';
        card.dataset.id = p.id;

        const swatches = p.previewColors
          .map(c => `<div class="swatch" style="background:${c}"></div>`)
          .join('');

        card.innerHTML = `
          <div class="icon">${p.icon}</div>
          <div class="name">${p.name}</div>
          <div class="desc">${p.description}</div>
          <div class="preview">${swatches}</div>
        `;

        card.addEventListener('click', () => selectPalette(p.id));
        grid.appendChild(card);
      });
    }

    function selectPalette(id) {
      activePaletteId = id;

      // Update UI
      document.querySelectorAll('.palette-card').forEach(c => {
        c.classList.toggle('active', c.dataset.id === id);
      });

      // Apply immediately if overlay is running
      applyCurrentPalette();
      document.getElementById('status').textContent = `Active: ${id}`;
    }

    function applyCurrentPalette() {
      if (!activePaletteId) return;
      const intensity = parseInt(document.getElementById('intensity').value) / 100;

      if (overlayRunning) {
        // Use smooth transition
        ipcRenderer.send('transition-palette', {
          paletteId: activePaletteId,
          intensity,
          duration: 400
        });
      } else {
        // Just set it (will be visible when overlay starts)
        ipcRenderer.send('apply-palette', {
          paletteId: activePaletteId,
          intensity
        });
      }
    }

    // ============================================================
    // Controls
    // ============================================================

    document.getElementById('intensity').addEventListener('input', (e) => {
      document.getElementById('intensity-value').textContent = e.target.value + '%';
      applyCurrentPalette();
    });

    document.getElementById('btn-start').addEventListener('click', () => {
      if (!activePaletteId) {
        document.getElementById('status').textContent = '⚠ Select a palette first!';
        return;
      }
      ipcRenderer.send('start-fullscreen-mode');
      overlayRunning = true;
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'block';
      document.getElementById('status').textContent = '🟢 Overlay active — full screen';

      // Apply the palette after a short delay to let overlay load
      setTimeout(() => applyCurrentPalette(), 300);
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      ipcRenderer.send('stop-overlay');
      overlayRunning = false;
      document.getElementById('btn-start').style.display = 'block';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('status').textContent = 'Overlay stopped';
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      ipcRenderer.send('reset-palette');
      activePaletteId = null;
      document.querySelectorAll('.palette-card').forEach(c => c.classList.remove('active'));
      document.getElementById('status').textContent = 'Reset to normal';
    });

    // ============================================================
    // Init
    // ============================================================
    loadPalettes();
  </script>
</body>
</html>
