<!DOCTYPE html>
<html>
<head>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
      background: #1a1a2e;
      color: #eee;
      user-select: none;
    }

    /* Header */
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .header h2 { font-size: 20px; }
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-native { background: #10b981; color: #000; }
    .badge-overlay { background: #f59e0b; color: #000; }
    .subtitle { color: #888; font-size: 12px; margin-bottom: 14px; }

    /* Palette grid */
    .palette-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .palette-card {
      background: #2a2a40;
      border: 2px solid transparent;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .palette-card:hover { background: #3a3a55; }
    .palette-card.active { border-color: #6c63ff; background: #33305a; }
    .palette-card .top { display: flex; align-items: center; gap: 6px; }
    .palette-card .icon { font-size: 16px; }
    .palette-card .name { font-size: 12px; font-weight: 600; }
    .palette-card .desc { font-size: 10px; color: #777; margin-top: 2px; }
    .preview { display: flex; gap: 2px; margin-top: 5px; }
    .preview .swatch { width: 14px; height: 14px; border-radius: 3px; }

    /* Controls */
    .controls {
      background: #2a2a40;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .controls label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .controls input[type="range"] { width: 100%; accent-color: #6c63ff; }
    .intensity-val { color: #6c63ff; font-weight: 600; }

    /* Window picker (overlay mode only) */
    .window-section {
      background: #2a2a40;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 10px;
    }
    .window-section h3 { font-size: 13px; color: #aaa; margin-bottom: 6px; }
    .window-list {
      max-height: 140px;
      overflow-y: auto;
    }
    .window-item {
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .window-item:hover { background: #3a3a55; }
    .window-item.active { background: #33305a; color: #a5a0ff; }

    /* Buttons */
    .btn {
      display: block; width: 100%; padding: 10px;
      border: none; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; margin-bottom: 6px;
      transition: all 0.15s;
    }
    .btn-primary { background: #6c63ff; color: #fff; }
    .btn-primary:hover { background: #5a52e0; }
    .btn-primary:disabled { background: #3a3a55; color: #666; cursor: not-allowed; }
    .btn-danger { background: #ff4757; color: #fff; }
    .btn-danger:hover { background: #e03e4d; }
    .btn-secondary { background: #3a3a55; color: #ccc; }
    .btn-secondary:hover { background: #4a4a65; }

    .status {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>🎨 ScreenTint</h2>
    <span class="badge" id="backend-badge">...</span>
  </div>
  <p class="subtitle" id="subtitle">Loading...</p>

  <div id="palette-grid" class="palette-grid"></div>

  <div class="controls">
    <label>Intensity <span class="intensity-val" id="intensity-val">100%</span></label>
    <input type="range" id="intensity" min="0" max="100" value="100" />
  </div>

  <!-- Only shown in overlay mode -->
  <div class="window-section" id="window-section" style="display:none">
    <h3>🪟 Target Window</h3>
    <div class="window-list" id="window-list">Loading...</div>
    <button class="btn btn-secondary" id="btn-refresh" style="margin-top:6px">↻ Refresh Windows</button>
  </div>

  <button class="btn btn-primary" id="btn-apply" disabled>▶ Apply</button>
  <button class="btn btn-danger" id="btn-stop" style="display:none">■ Stop / Reset</button>

  <p class="status" id="status"></p>

  <script>
    const { ipcRenderer } = require('electron');

    let backend = 'overlay';      // 'native' or 'overlay'
    let activePaletteId = null;
    let selectedWindow = null;    // overlay mode only
    let isActive = false;

    // ────────────────────────────────────────────────────
    // Init: detect backend and set up UI
    // ────────────────────────────────────────────────────
    async function init() {
      backend = await ipcRenderer.invoke('get-backend');

      const badge = document.getElementById('backend-badge');
      const subtitle = document.getElementById('subtitle');
      const winSection = document.getElementById('window-section');

      if (backend === 'native') {
        badge.textContent = 'GPU';
        badge.className = 'badge badge-native';
        subtitle.textContent = 'Pick a palette — applied instantly via Windows Magnification API (zero lag)';
      } else {
        badge.textContent = 'Overlay';
        badge.className = 'badge badge-overlay';
        subtitle.textContent = 'Pick a palette + target window (per-window overlay mode)';
        winSection.style.display = 'block';
        loadWindows();
      }

      await loadPalettes();
      updateApplyButton();
    }

    // ────────────────────────────────────────────────────
    // Load palettes from vision-api
    // ────────────────────────────────────────────────────
    async function loadPalettes() {
      const palettes = await ipcRenderer.invoke('get-palettes');
      const grid = document.getElementById('palette-grid');
      grid.innerHTML = '';

      palettes.forEach(p => {
        if (p.id === 'custom') return;
        const card = document.createElement('div');
        card.className = 'palette-card';
        card.dataset.id = p.id;

        const swatches = p.previewColors
          .map(c => `<div class="swatch" style="background:${c}"></div>`).join('');

        card.innerHTML = `
          <div class="top"><span class="icon">${p.icon}</span><span class="name">${p.name}</span></div>
          <div class="desc">${p.description}</div>
          <div class="preview">${swatches}</div>
        `;
        card.addEventListener('click', () => selectPalette(p.id));
        grid.appendChild(card);
      });
    }

    function selectPalette(id) {
      activePaletteId = id;
      document.querySelectorAll('.palette-card').forEach(c =>
        c.classList.toggle('active', c.dataset.id === id)
      );
      updateApplyButton();

      // If already active, live-update the palette
      if (isActive) applyCurrentPalette();
    }

    // ────────────────────────────────────────────────────
    // Window list (overlay mode only)
    // ────────────────────────────────────────────────────
    function loadWindows() {
      ipcRenderer.send('get-sources');
    }

    ipcRenderer.on('sources-list', (_, sources) => {
      const list = document.getElementById('window-list');
      list.innerHTML = '';
      sources.forEach(s => {
        if (!s.name || s.name === 'ScreenTint') return;
        const item = document.createElement('div');
        item.className = 'window-item';
        item.textContent = s.name;
        item.addEventListener('click', () => {
          selectedWindow = { name: s.name, id: s.id };
          document.querySelectorAll('.window-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          updateApplyButton();
        });
        list.appendChild(item);
      });
    });

    document.getElementById('btn-refresh').addEventListener('click', loadWindows);

    // ────────────────────────────────────────────────────
    // Controls
    // ────────────────────────────────────────────────────

    function getIntensity() {
      return parseInt(document.getElementById('intensity').value) / 100;
    }

    document.getElementById('intensity').addEventListener('input', (e) => {
      document.getElementById('intensity-val').textContent = e.target.value + '%';
      if (isActive) applyCurrentPalette();
    });

    function updateApplyButton() {
      const btn = document.getElementById('btn-apply');
      if (backend === 'native') {
        btn.disabled = !activePaletteId;
      } else {
        btn.disabled = !activePaletteId || !selectedWindow;
      }
    }

    function applyCurrentPalette() {
      if (!activePaletteId) return;
      ipcRenderer.send('transition-palette', {
        paletteId: activePaletteId,
        intensity: getIntensity(),
        duration: 300,
      });
    }

    // ────────────────────────────────────────────────────
    // Apply / Stop
    // ────────────────────────────────────────────────────

    document.getElementById('btn-apply').addEventListener('click', () => {
      if (!activePaletteId) return;

      if (backend === 'native') {
        // Native: just apply the palette. DWM handles the rest. Zero lag.
        ipcRenderer.send('activate-native', {
          paletteId: activePaletteId,
          intensity: getIntensity(),
        });
      } else {
        // Overlay: start per-window overlay, then apply palette
        if (!selectedWindow) return;
        ipcRenderer.send('start-window-overlay', selectedWindow);
        setTimeout(() => applyCurrentPalette(), 300);
      }

      isActive = true;
      document.getElementById('btn-apply').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'block';
      document.getElementById('status').textContent =
        backend === 'native'
          ? '🟢 Active — GPU color transform (zero lag)'
          : `🟡 Active — overlay on "${selectedWindow.name}"`;
    });

    document.getElementById('btn-stop').addEventListener('click', () => {
      ipcRenderer.send('reset-palette');
      if (backend === 'overlay') ipcRenderer.send('stop-overlay');
      isActive = false;
      document.getElementById('btn-apply').style.display = 'block';
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('status').textContent = 'Stopped';
    });

    // ────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
