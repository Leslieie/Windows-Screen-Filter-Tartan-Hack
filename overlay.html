<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      margin: 0; 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* background: black; */
    }
    #canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <script>
    const { ipcRenderer } = require('electron');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let currentWindowInfo = null;

    ipcRenderer.on('window-info', (event, info) => {
      currentWindowInfo = info;
      canvas.width = info.width;
      canvas.height = info.height;
      startAutoScreenshot();
    });

    function startAutoScreenshot() {
      setInterval(() => {
        if (currentWindowInfo) {
          ipcRenderer.send('take-screenshot', currentWindowInfo);
        }
      }, 500);
    }

    ipcRenderer.on('screenshot-ready', (event, imageDataUrl) => {
      const img = new Image();
      img.onload = () => {
        // Just draw the screenshot, no effects
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = imageDataUrl;
    });
  </script>
</body>
</html>
