<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
      margin: 0; 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <script>
    const { ipcRenderer } = require('electron');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    let currentWindowInfo = null;

    ipcRenderer.on('window-info', (event, info) => {
      currentWindowInfo = info;
      canvas.width = info.width;
      canvas.height = info.height;
      startAutoScreenshot();
    });

    function startAutoScreenshot() {
      setInterval(() => {
        if (currentWindowInfo) {
          ipcRenderer.send('take-screenshot', currentWindowInfo);
        }
      }, 1000); // Update 10 times per second for smooth effect
    }

    ipcRenderer.on('screenshot-ready', (event, imageDataUrl) => {
      // Load image
      const img = new Image();
      img.onload = () => {
        // Draw original image
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Apply blur effect
        ctx.filter = 'blur(10px)';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.filter = 'none';
        
        // Add tint
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };
      img.src = imageDataUrl;
    });
  </script>
</body>
</html>
